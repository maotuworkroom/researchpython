# 重活云端模板：只挂 workflow_dispatch（手动触发），不挂 push/PR 触发面。
# 用途：把本机 CPU 重活（图后处理 / 数值校验）搬到 Actions runner 上批量跑。
# 触发示例见 cloudoffload 交付目录中的 dispatch.py。
name: heavy-task

on:
  workflow_dispatch:
    inputs:
      task:
        description: "任务类型: stamp-pipeline=印章全流程(门禁/归一/嵌字/复检), color-norm=色彩归一批量, stamp-ocr-gate=tesseract OCR 文字门禁(mode=tune|regress|defects)"
        required: true
        type: choice
        options:
          - stamp-pipeline
          - color-norm
          - stamp-ocr-gate
        default: stamp-pipeline
      params_json:
        description: '任务参数 JSON: {"repeat":3,"workers":4} / stamp-ocr-gate: {"mode":"tune","workers":4}'
        required: false
        default: '{"repeat": 3, "workers": 4}'
        type: string

# 串行保护：重活同时最多跑 1 个，防止并发 dispatch 叠加烧分钟数
concurrency:
  group: heavy-task
  cancel-in-progress: false

jobs:
  run:
    # 8 核：把下面换成你账号可用的 larger runner 标签（如 linux-8-core）；
    # 标准 ubuntu-latest 为 4 vCPU（2025 年后规格），倍率按 1x 计。
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --quiet numpy opencv-python-headless pillow pytesseract fonttools
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq fonts-noto-cjk tesseract-ocr tesseract-ocr-jpn >/dev/null 2>&1 || true

      - name: Machine info
        run: |
          echo "nproc=$(nproc)"
          free -m | head -2
          df -h / | tail -1
          python -c "import cv2, numpy; print('cv2', cv2.__version__, 'numpy', numpy.__version__)"
          tesseract --version 2>&1 | head -1 || echo "tesseract missing"
          tesseract --list-langs 2>&1 | tail -5 || true

      - name: Verify deps (fail fast, 不静默跳过)
        run: |
          tesseract --version 2>&1 | head -1
          tesseract --list-langs 2>&1 | grep -qx jpn || { echo "::error::tesseract-ocr-jpn 缺失"; exit 1; }
          test -n "$(ls /usr/share/fonts/opentype/noto/NotoSansCJK*.ttc 2>/dev/null)" \
            || { echo "::error::Noto CJK 字体缺失"; exit 1; }
          python -c "import cv2,numpy,PIL,pytesseract,fontTools; print('py deps ok')"

      - name: Run task
        env:
          TASK: ${{ inputs.task }}
          PARAMS: ${{ inputs.params_json }}
        run: python tools/run_task.py --task "$TASK" --params "$PARAMS"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heavy-task-result
          path: |
            out/
            !out/_scratch/
          retention-days: 7
